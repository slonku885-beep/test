<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; display: grid; place-items: center; height: 100vh;
           font-family: sans-serif; background: #fff; color: #222; }
    a { display: inline-block; padding: 12px 28px; font-size: 16px; border-radius: 8px;
        background: #2481cc; color: #fff; text-decoration: none; }
    p { color: #888; }
  </style>
</head>
<body>
  <p>Открываем…</p>
  <a id="btn" hidden>Открыть бота</a>
  <script>
    const q = new URLSearchParams(location.search);
    const param = q.get("c") || q.get("start") || "";
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    fetch("targets.json?ts=" + Date.now(), { cache: "no-store" })
      .then(r => r.json())
      .then(cfg => {
        const target = cfg.target_bot;
        const tme = "https://t.me/" + target + (param ? "?start=" + param : "");
        const tg  = "tg://resolve?domain=" + target + (param ? "&start=" + param : "");

        const btn = document.getElementById("btn");
        btn.href = tme;
        setTimeout(() => { btn.hidden = false; }, 1500);

        if (isMobile) {
          // универсальная ссылка: ОС сама откроет приложение Telegram
          location.replace(tme);
        } else {
          // ПК: прыжок напрямую в клиент Telegram без лендинга t.me
          location.replace(tg);
        }
      })
      .catch(() => {
        document.querySelector("p").textContent = "Не удалось загрузить конфиг";
      });
  </script>
</body>
</html>
